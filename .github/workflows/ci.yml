name: Phase 0 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: links
          POSTGRES_PASSWORD: links-ci-only
          POSTGRES_DB: links_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U links -d links_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      LINKS_TEST_DATABASE_URL: postgresql://links:links-ci-only@127.0.0.1:5432/links_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test -p links-server-store --test postgres --locked -- --ignored
      - run: cargo check -p links-client-core --target wasm32-unknown-unknown --locked
