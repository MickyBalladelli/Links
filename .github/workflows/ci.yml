name: Core and account checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: links
          POSTGRES_PASSWORD: links-ci-only
          POSTGRES_DB: links_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U links -d links_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      LINKS_TEST_DATABASE_URL: postgresql://links:links-ci-only@127.0.0.1:5432/links_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --all-targets --locked -- --ignored
      - run: cargo check -p links-client-core --target wasm32-unknown-unknown --locked
  apple-vault:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path native/apple
      - run: xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -typecheck native/apple/Sources/LinksKeyStore/HardwareSeedVault.swift
  android-vault-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p native/android assembleDebug assembleDebugAndroidTest
      # Physical hardware round-trip tests are a separate release gate.
