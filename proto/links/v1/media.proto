syntax = "proto3";
package links.v1;

// PRIVATE: only inside an encrypted Message; never an upload API body or log.
message MediaMetadata {
  string attachment_id = 1;
  string mime_type = 2;
  uint64 ciphertext_size_bytes = 3;
  bytes content_key = 4;
  bytes nonce = 5;
  bytes ciphertext_sha256 = 6;
  optional uint32 width = 7;
  optional uint32 height = 8;
  optional uint64 duration_ms = 9;
  // Private 4x3 BlurHash placeholder; stays inside the encrypted Message.
  optional string blur_hash = 10;
  optional OpusAudioMetadata opus = 11;
  // Present only for chunk-encrypted large attachments; private E2EE metadata.
  optional uint64 original_size_bytes = 12;
  optional uint32 encryption_chunk_bytes = 13;
}

message OpusAudioMetadata {
  enum Container {
    CONTAINER_UNSPECIFIED = 0;
    OGG = 1;
    OPUS = 2;
  }
  Container container = 1;
  uint32 bitrate_kbps = 2;
  uint32 sample_rate_hz = 3;
  uint32 channels = 4;
  uint32 frame_duration_ms = 5;
}
