syntax = "proto3";
package links.v1;
import "links/v1/envelope.proto";
import "links/v1/sync.proto";
import "links/v1/webrtc.proto";

// One binary protobuf frame per WebSocket message; see docs/contracts.md.
message ClientFrame {
  string request_id = 1;
  oneof body {
    Hello hello = 2;
    Envelope send = 3;
    Replay replay = 4;
    QueueAck ack = 5;
    WebRtcSignal web_rtc_signal = 6;
    MlsBootstrap mls_bootstrap = 7;
  }
}
message Hello {
  uint32 protocol_version = 1;
  string device_id = 2;
  bytes device_access_token = 3; // Short-lived bearer secret. Never log frames.
  uint64 last_seen_cursor = 4;
  repeated SyncCompression supported_sync_compression = 5;
}
message Replay { uint64 after_cursor = 1; uint32 limit = 2; }
message ServerFrame {
  string request_id = 1;
  oneof body {
    Welcome welcome = 2;
    Accepted accepted = 3;
    SyncBatch batch = 4;
    ProtocolError error = 5;
    CompressedSyncBatch compressed_batch = 6;
    WebRtcSignalDelivery web_rtc_signal = 7;
    MlsBootstrap mls_bootstrap = 8;
  }
}
message Welcome { uint32 protocol_version = 1; uint32 heartbeat_seconds = 2; }
message Accepted { string envelope_id = 1; } // Durable enqueue, not peer delivery.
message ProtocolError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_INVALID_ARGUMENT = 1;
    CODE_UNAUTHENTICATED = 2;
    CODE_UNSUPPORTED_VERSION = 3;
    CODE_RATE_LIMITED = 4;
    CODE_CURSOR_EXPIRED = 5;
    CODE_TEMPORARILY_UNAVAILABLE = 6;
    CODE_SESSION_CONFLICT = 7;
  }
  Code code = 1;
  uint32 retry_after_ms = 2;
}

// Live MLS group bootstrap. The gateway routes these opaque bytes to the
// target device and never stores or inspects them. The sender keeps its local
// pending commit until the peer has received this frame.
message MlsBootstrap {
  string conversation_id = 1;
  string recipient_device_id = 2;
  bytes commit = 3;
  bytes welcome = 4;
  bytes sender_mls_credential = 5;
  bytes sender_identity_public_key = 6;
}
