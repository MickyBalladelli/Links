syntax = "proto3";
package links.v1;

// Public directory record. Phone numbers and private key material are forbidden.
message User {
  string user_id = 1; // Canonical non-nil UUID.
  optional string handle = 2; // Lowercase ASCII, 3-32 characters.
  repeated Device devices = 3;
}
message Device {
  string device_id = 1;
  string user_id = 2;
  bytes identity_public_key = 3;
  bytes mls_credential = 4; // Public credential, not MLS private group state.
  uint64 registered_at_ms = 5;
  optional uint64 revoked_at_ms = 6;
  optional bytes delegation_certificate = 7;
  uint32 delegation_role = 8; // 0=root, 1=device, 2=admin.
}

// Public certificate signed by an existing account device. It binds a new
// physical device key and MLS node to the same account and grants a bounded
// device/admin role. Private keys never enter this message.
message DeviceSubCertificate {
  uint32 protocol_version = 1;
  string user_id = 2;
  string issuer_device_id = 3;
  string issuer_mls_node_id = 4;
  bytes issuer_public_key = 5;
  string subject_device_id = 6;
  string subject_mls_node_id = 7;
  bytes subject_public_key = 8;
  uint32 delegation_role = 9;
  uint64 issued_at_ms = 10;
  uint64 expires_at_ms = 11;
  bytes signature = 12;
}
