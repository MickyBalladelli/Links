syntax = "proto3";
package links.v1;

// Cross-gateway queue message. The envelope field is the exact serialized
// Envelope bytes. Queue workers may validate its protobuf boundary, but never
// decrypt, parse, label or log sealed_payload.
message GatewayDelivery {
  uint32 protocol_version = 1;
  string source_gateway_id = 2;
  string destination_gateway_id = 3;
  uint64 cursor = 4;
  bytes serialized_envelope = 5;
}
