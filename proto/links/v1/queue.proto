syntax = "proto3";
package links.v1;

// Cross-gateway queue message. The envelope field is the exact serialized
// Envelope bytes. Queue workers may validate its protobuf boundary, but never
// decrypt, parse, label or log sealed_payload.
message GatewayDelivery {
  uint32 protocol_version = 1;
  string source_gateway_id = 2;
  string destination_gateway_id = 3;
  uint64 cursor = 4;
  bytes serialized_envelope = 5;
}

// Signed opaque envelope batch exchanged by federated server nodes. Relay
// workers may validate routing, signatures and protobuf boundaries, but never
// decrypt or inspect the serialized Envelope sealed_payload bytes.
message FederatedEnvelopeBatch {
  uint32 protocol_version = 1;
  string source_node_id = 2;
  string destination_node_id = 3;
  string batch_id = 4;
  uint64 expires_at_ms = 5;
  repeated bytes serialized_envelopes = 6;
  bytes body_sha256 = 7;
  bytes signature = 8;
}
