syntax = "proto3";
package links.v1;

// Public SFU endpoint record for an authenticated DHT control plane. It has
// no room, account, participant, token, MLS, or media data.
message SfuDiscoveryRecord {
  uint32 protocol_version = 1;
  string node_id = 2;
  string region = 3;
  string websocket_url = 4;
  string turn_url = 5;
  bytes public_key = 6;
  uint64 sequence = 7;
  uint64 expires_at_ms = 8;
  bool supports_sframe = 9;
  bytes signature = 10;
}
