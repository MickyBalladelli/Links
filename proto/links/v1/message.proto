syntax = "proto3";
package links.v1;
import "links/v1/media.proto";
import "links/v1/receipts.proto";

// PRIVATE: serialize then encrypt on the client. Routing never sees this type.
message Message {
  string message_id = 1;
  string conversation_id = 2;
  string sender_device_id = 3;
  uint64 sent_at_ms = 4;
  uint64 sequence_id = 8; // Sender-local monotonic counter inside the conversation.
  oneof content {
    string text = 5;
    MediaMetadata media = 6;
    Receipts receipts = 7;
    BroadcastPost broadcast_post = 9;
    MlsControl mls_control = 10;
  }
}

// PRIVATE: only inside an MLS application message. Never expose this type to
// routing, signaling, SFU, queue, or blob-storage services.
message MlsControl {
  uint32 protocol_version = 1;
  oneof body {
    SFrameEpochKeyUpdate sframe_epoch_key = 2;
    GroupInfo group_info = 3;
  }
}

// PRIVATE: group display metadata, shared only inside the group's MLS
// ciphertext. The server never learns a group's name.
message GroupInfo {
  string name = 1;
}

// An MLS-authenticated media key handoff. The key is protected by the outer
// MLS application ciphertext and is never a server-readable field.
message SFrameEpochKeyUpdate {
  string media_session_id = 1;
  uint64 epoch = 2;
  uint64 key_id = 3;
  uint32 cipher_suite = 4; // 1=AES_128_GCM_SHA256_128.
  bytes key = 5; // 128-bit SFrame key, only inside MLS ciphertext.
}

// PRIVATE: only inside an encrypted broadcast Message. The signature binds
// the conversation, message, sender device, epoch, post ID, and payload.
message BroadcastPost {
  string post_id = 1;
  uint64 epoch = 2;
  string admin_device_id = 3;
  bytes admin_public_key = 4;
  bytes payload = 5;
  bytes signature = 6;
}
