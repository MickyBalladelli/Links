[workspace]
members = ["crates/protocol", "crates/client-core", "crates/server-store", "crates/identity", "crates/account-auth", "crates/identity-ffi", "crates/gateway", "crates/queue", "crates/web-client", "crates/desktop-client", "crates/desktop-client-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
async-trait = "0.1"
argon2 = "0.5"
base64 = "0.22"
bip39 = { version = "2.2.2", default-features = false, features = ["alloc", "zeroize"] }
prost = "0.14"
opus = "0.4"
zstd = "0.13"
thiserror = "2"
uuid = "1"
wasm-bindgen = "0.2.128"
zeroize = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
# OpenMLS RustCrypto still reaches getrandom 0.2 through elliptic-curve crates;
# expose its WASM JavaScript entropy feature for the shared client build.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
hkdf = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["hash2curve"] }
serde_cbor = "0.11"
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
x25519-dalek = { version = "3", features = ["static_secrets"] }
ml-kem = { version = "0.3", features = ["hazmat", "zeroize"] }
openmls = { version = "=0.9.0", default-features = false, features = ["js"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = "=0.6.0"
wasmi = { version = "1.1.0", default-features = false, features = ["std", "extra-checks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros"] }
links-protocol = { path = "crates/protocol" }
links-client-core = { path = "crates/client-core" }
links-server-store = { path = "crates/server-store" }
