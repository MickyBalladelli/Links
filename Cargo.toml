[workspace]
members = ["crates/protocol", "crates/client-core", "crates/server-store", "crates/identity", "crates/account-auth", "crates/identity-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
async-trait = "0.1"
prost = "0.14"
thiserror = "2"
uuid = "1"
zeroize = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate", "macros"] }
links-protocol = { path = "crates/protocol" }
links-client-core = { path = "crates/client-core" }
